<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Primary button</title>
<style>
@import url("../colors_and_type.css");
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: #FBF8F4;
  color: #14110F;
  font-family: "Inter", -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body { padding: 24px 28px; min-height: 100vh; }
:root {
  --crimson:#B22230; --crimson-deep:#8E1A26; --crimson-soft:#FF8B96;
  --paper:#FBF8F4; --paper-2:#F1ECE3; --paper-3:#ECE7DC;
  --ink:#14110F; --ink-2:#2A2520; --mute:#6A625A; --rule:#D9D2C7;
  --green:#2F6E4E;
  --serif: "Fraunces", Georgia, serif;
  --sans: "Inter", -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.row { display:flex; gap:16px; align-items:stretch; flex-wrap:wrap; }
.col { display:flex; flex-direction:column; gap:12px; }
.swatch { width: 100%; height: 64px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.04); }
.sw-meta { display:flex; justify-content:space-between; gap:8px; font-family: var(--mono); font-size: 11px; color: var(--mute); margin-top: 8px; }
.sw-meta .name { color: var(--ink-2); font-weight:500; }
.sw-meta .hex { color: var(--mute); }
.tile { display:flex; flex-direction:column; }
</style>
</head>
<body>

<div class="eyebrow" style="margin-bottom:14px;">PRIMARY · CRIMSON FILL · OPTIONAL MONO BADGE</div>
<div class="row" style="gap:20px; align-items:center;">
  <a style="background:#B22230; color:#FBF8F4; padding:14px 20px; font-family:var(--sans); font-size:15px; font-weight:500; border-radius:4px; display:inline-flex; align-items:center; gap:10px; text-decoration:none;">
    Book a 15-min intro
    <span style="font-family:var(--mono); font-size:11px; background:rgba(251,248,244,0.18); padding:3px 7px; border-radius:3px; letter-spacing:0.04em;">CALENDLY</span>
  </a>
  <a style="background:#8E1A26; color:#FBF8F4; padding:14px 20px; font-family:var(--sans); font-size:15px; font-weight:500; border-radius:4px; display:inline-flex; align-items:center; gap:10px; text-decoration:none;">
    Hover state
    <span style="font-family:var(--mono); font-size:11px; background:rgba(251,248,244,0.18); padding:3px 7px; border-radius:3px; letter-spacing:0.04em;">→</span>
  </a>
</div>
<div class="row" style="gap:20px; align-items:center; margin-top:18px;">
  <a style="background:#B22230; color:#FBF8F4; padding:9px 14px; font-family:var(--sans); font-size:13px; font-weight:500; border-radius:4px; text-decoration:none;">Book a call</a>
  <span style="font-family:var(--mono); font-size:11px; color:#6A625A;">small / nav variant — 9px 14px / 13px</span>
</div>

</body>
</html>
