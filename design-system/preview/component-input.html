<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inputs</title>
<style>
@import url("../colors_and_type.css");
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: #FBF8F4;
  color: #14110F;
  font-family: "Inter", -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body { padding: 24px 28px; min-height: 100vh; }
:root {
  --crimson:#B22230; --crimson-deep:#8E1A26; --crimson-soft:#FF8B96;
  --paper:#FBF8F4; --paper-2:#F1ECE3; --paper-3:#ECE7DC;
  --ink:#14110F; --ink-2:#2A2520; --mute:#6A625A; --rule:#D9D2C7;
  --green:#2F6E4E;
  --serif: "Fraunces", Georgia, serif;
  --sans: "Inter", -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.row { display:flex; gap:16px; align-items:stretch; flex-wrap:wrap; }
.col { display:flex; flex-direction:column; gap:12px; }
.swatch { width: 100%; height: 64px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.04); }
.sw-meta { display:flex; justify-content:space-between; gap:8px; font-family: var(--mono); font-size: 11px; color: var(--mute); margin-top: 8px; }
.sw-meta .name { color: var(--ink-2); font-weight:500; }
.sw-meta .hex { color: var(--mute); }
.tile { display:flex; flex-direction:column; }
</style>
</head>
<body>

<div class="eyebrow" style="margin-bottom:14px;">INPUTS · PAPER + HAIRLINE / INK + RGBA</div>
<div style="display:flex; gap:8px; margin-bottom:16px;">
  <input placeholder="you@company.com" style="flex:1; padding:12px 14px; font-family:var(--sans); font-size:14px; background:#fff; border:1px solid #D9D2C7; color:#14110F; border-radius:4px; outline:none;" />
  <button style="background:#B22230; color:#FBF8F4; border:0; padding:12px 18px; font-family:var(--sans); font-size:14px; font-weight:500; border-radius:4px; cursor:pointer;">Send</button>
</div>
<div style="background:#14110F; padding:16px; border-radius:6px; display:flex; gap:8px;">
  <input placeholder="you@company.com" style="flex:1; background:rgba(251,248,244,0.06); border:1px solid rgba(251,248,244,0.16); color:#FBF8F4; padding:12px 14px; font-family:var(--sans); font-size:14px; border-radius:4px; outline:none;" />
  <button style="background:#FBF8F4; color:#14110F; border:0; padding:12px 18px; font-family:var(--sans); font-size:14px; font-weight:500; border-radius:4px; cursor:pointer;">Send</button>
</div>

</body>
</html>
