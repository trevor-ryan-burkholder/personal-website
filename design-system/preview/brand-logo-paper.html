<!doctype html>
<html><head><meta charset="utf-8">
<title>Logo — variants</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #FBF8F4; padding: 24px 28px; font-family: "JetBrains Mono", monospace; }
.row { display: flex; gap: 20px; align-items: stretch; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px; border-radius: 6px; flex: 1; }
.tile.paper { background: #FBF8F4; border: 1px solid #D9D2C7; }
.tile.crimson { background: #B22230; }
.tile.ink { background: #14110F; }
.label { font-size: 11px; color: #6A625A; letter-spacing: 0.04em; }
.label.on-dark { color: rgba(251,248,244,0.6); }
img { display: block; max-width: 100%; height: auto; }
</style></head><body>
<div class="row">
  <div class="tile paper">
    <img src="../assets/logo-paper.svg" style="height:50px; width:auto;">
    <div class="label">logo-paper.svg</div>
  </div>
  <div class="tile crimson">
    <img src="../assets/logo.svg" style="height:50px; width:auto;">
    <div class="label on-dark">logo.svg</div>
  </div>
  <div class="tile paper">
    <img src="../assets/logo-mono-ink.svg" style="height:50px; width:auto;">
    <div class="label">logo-mono-ink.svg</div>
  </div>
</div>
</body></html>
