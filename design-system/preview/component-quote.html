<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quote card</title>
<style>
@import url("../colors_and_type.css");
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: #FBF8F4;
  color: #14110F;
  font-family: "Inter", -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body { padding: 24px 28px; min-height: 100vh; }
:root {
  --crimson:#B22230; --crimson-deep:#8E1A26; --crimson-soft:#FF8B96;
  --paper:#FBF8F4; --paper-2:#F1ECE3; --paper-3:#ECE7DC;
  --ink:#14110F; --ink-2:#2A2520; --mute:#6A625A; --rule:#D9D2C7;
  --green:#2F6E4E;
  --serif: "Fraunces", Georgia, serif;
  --sans: "Inter", -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.row { display:flex; gap:16px; align-items:stretch; flex-wrap:wrap; }
.col { display:flex; flex-direction:column; gap:12px; }
.swatch { width: 100%; height: 64px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.04); }
.sw-meta { display:flex; justify-content:space-between; gap:8px; font-family: var(--mono); font-size: 11px; color: var(--mute); margin-top: 8px; }
.sw-meta .name { color: var(--ink-2); font-weight:500; }
.sw-meta .hex { color: var(--mute); }
.tile { display:flex; flex-direction:column; }
</style>
</head>
<body>

<div style="padding:24px; border:1px solid #D9D2C7; border-radius:6px; background:#fff; max-width:560px;">
  <p style="font-family:var(--serif); font-weight:400; font-size:17px; line-height:1.5; color:#14110F; margin:0 0 18px;">
    "Trevor is exceptionally talented and uncommonly motivated. He has a great eye for design, cares about doing things right, and is great at communicating complex ideas with all levels of stakeholders."
  </p>
  <div style="display:flex; align-items:center; gap:12px;">
    <div style="width:32px; height:32px; background:#F1ECE3; border-radius:50%; border:1px solid #D9D2C7;"></div>
    <div>
      <div style="font-family:var(--sans); font-size:13px; font-weight:500;">Rex Petersen</div>
      <div style="font-family:var(--mono); font-size:10px; color:#6A625A; letter-spacing:0.04em;">DIR. APPLICATION ENGINEERING · WESTERRA CREDIT UNION</div>
    </div>
  </div>
</div>

</body>
</html>
