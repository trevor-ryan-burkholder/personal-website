<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elevation — only one shadow</title>
<style>
@import url("../colors_and_type.css");
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: #FBF8F4;
  color: #14110F;
  font-family: "Inter", -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body { padding: 24px 28px; min-height: 100vh; }
:root {
  --crimson:#B22230; --crimson-deep:#8E1A26; --crimson-soft:#FF8B96;
  --paper:#FBF8F4; --paper-2:#F1ECE3; --paper-3:#ECE7DC;
  --ink:#14110F; --ink-2:#2A2520; --mute:#6A625A; --rule:#D9D2C7;
  --green:#2F6E4E;
  --serif: "Fraunces", Georgia, serif;
  --sans: "Inter", -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.row { display:flex; gap:16px; align-items:stretch; flex-wrap:wrap; }
.col { display:flex; flex-direction:column; gap:12px; }
.swatch { width: 100%; height: 64px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.04); }
.sw-meta { display:flex; justify-content:space-between; gap:8px; font-family: var(--mono); font-size: 11px; color: var(--mute); margin-top: 8px; }
.sw-meta .name { color: var(--ink-2); font-weight:500; }
.sw-meta .hex { color: var(--mute); }
.tile { display:flex; flex-direction:column; }
</style>
</head>
<body>

<div class="row" style="gap:32px; align-items:center; padding-top:12px;">
  <div class="tile" style="flex:1 1 0; align-items:center;">
    <div style="width:160px; height:80px; background:#fff; border:1px solid #D9D2C7; border-radius:6px;"></div>
    <div style="font-family:var(--mono); font-size:11px; color:#2A2520; margin-top:14px;">--border-hair</div>
    <div style="font-family:var(--mono); font-size:10px; color:#6A625A;">1px solid rule</div>
  </div>
  <div class="tile" style="flex:1 1 0; align-items:center;">
    <div style="width:160px; height:80px; background:#fff; border-radius:8px; box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 20px 60px -20px rgba(20,17,15,0.35);"></div>
    <div style="font-family:var(--mono); font-size:11px; color:#2A2520; margin-top:14px;">--shadow-frame</div>
    <div style="font-family:var(--mono); font-size:10px; color:#6A625A;">mock frame only</div>
  </div>
  <div class="tile" style="flex:1 1 0; align-items:center; opacity:0.5;">
    <div style="width:160px; height:80px; background:#fff; border-radius:6px; box-shadow: 0 8px 20px rgba(0,0,0,0.12);"></div>
    <div style="font-family:var(--mono); font-size:11px; color:#B22230; margin-top:14px;">✗ DON'T</div>
    <div style="font-family:var(--mono); font-size:10px; color:#6A625A;">no card shadows</div>
  </div>
</div>

</body>
</html>
