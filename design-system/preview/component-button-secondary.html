<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Secondary & inverse buttons</title>
<style>
@import url("../colors_and_type.css");
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: #FBF8F4;
  color: #14110F;
  font-family: "Inter", -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body { padding: 24px 28px; min-height: 100vh; }
:root {
  --crimson:#B22230; --crimson-deep:#8E1A26; --crimson-soft:#FF8B96;
  --paper:#FBF8F4; --paper-2:#F1ECE3; --paper-3:#ECE7DC;
  --ink:#14110F; --ink-2:#2A2520; --mute:#6A625A; --rule:#D9D2C7;
  --green:#2F6E4E;
  --serif: "Fraunces", Georgia, serif;
  --sans: "Inter", -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.row { display:flex; gap:16px; align-items:stretch; flex-wrap:wrap; }
.col { display:flex; flex-direction:column; gap:12px; }
.swatch { width: 100%; height: 64px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.04); }
.sw-meta { display:flex; justify-content:space-between; gap:8px; font-family: var(--mono); font-size: 11px; color: var(--mute); margin-top: 8px; }
.sw-meta .name { color: var(--ink-2); font-weight:500; }
.sw-meta .hex { color: var(--mute); }
.tile { display:flex; flex-direction:column; }
</style>
</head>
<body>

<div class="eyebrow" style="margin-bottom:14px;">SECONDARY (TEXT + UNDERLINE) · INVERSE (PAPER ON INK)</div>
<div class="row" style="gap:32px; align-items:center;">
  <a style="font-family:var(--sans); font-size:15px; color:#2A2520; border-bottom:1px solid #2A2520; padding-bottom:2px; text-decoration:none;">tburk83@gmail.com →</a>
  <a style="font-family:var(--sans); font-size:15px; color:#B22230; border-bottom:1px solid #B22230; padding-bottom:2px; text-decoration:none;">Hover state →</a>
</div>
<div style="background:#14110F; padding:18px 20px; border-radius:6px; margin-top:18px; display:inline-flex; align-items:center; gap:10px;">
  <a style="background:#FBF8F4; color:#14110F; padding:12px 18px; font-family:var(--sans); font-size:14px; font-weight:500; border-radius:4px; text-decoration:none; display:inline-flex; gap:8px; align-items:center;">
    Book a call on Calendly
    <span style="font-family:var(--mono); font-size:11px; background:rgba(20,17,15,0.08); padding:3px 7px; border-radius:3px;">→</span>
  </a>
</div>

</body>
</html>
