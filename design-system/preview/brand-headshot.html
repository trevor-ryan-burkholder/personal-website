<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Headshot — treatments</title>
<style>
@import url("../colors_and_type.css");
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #FBF8F4; color: #14110F; font-family: "Inter", sans-serif; padding: 24px 28px; }
.row { display: flex; gap: 24px; align-items: flex-end; }
.tile { display: flex; flex-direction: column; align-items: center; }
.label { font-family: "JetBrains Mono", monospace; font-size: 11px; color: #6A625A; margin-top: 10px; letter-spacing: 0.04em; }
.eyebrow { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6A625A; margin-bottom: 14px; }
.h-sm { width: 56px; height: 56px; object-fit: cover; object-position: center 25%; border-radius: 50%; }
.h-md { width: 110px; height: 140px; object-fit: cover; object-position: center 25%; border-radius: 6px; }
.h-lg { width: 168px; height: 210px; object-fit: cover; object-position: center 25%; border-radius: 6px; }
</style>
</head>
<body>
<div class="eyebrow">HEADSHOT · 4:5 PORTRAIT CROP · --r-lg / CIRCLE</div>
<div class="row">
  <div class="tile">
    <img class="h-lg" src="../assets/headshot.jpg" alt="" />
    <div class="label">about — 168×210</div>
  </div>
  <div class="tile">
    <img class="h-md" src="../assets/headshot.jpg" alt="" />
    <div class="label">card — 110×140</div>
  </div>
  <div class="tile">
    <img class="h-sm" src="../assets/headshot.jpg" alt="" />
    <div class="label">avatar 56px</div>
  </div>
  <div class="tile">
    <img src="../assets/headshot.jpg" alt="" style="width:36px; height:36px; object-fit:cover; object-position:center 25%; border-radius:50%; border:1px solid #D9D2C7;" />
    <div class="label">quote 36px</div>
  </div>
</div>
</body>
</html>
