<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fraunces cuts</title>
<style>
@import url("../colors_and_type.css");
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #FBF8F4; padding: 24px 28px; font-family: "Inter", sans-serif; color: #14110F; }
.eyebrow { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6A625A; margin-bottom: 18px; }
.row { display: grid; grid-template-columns: 90px 1fr; gap: 16px; align-items: baseline; padding: 12px 0; border-top: 1px solid #D9D2C7; }
.row:last-child { border-bottom: 1px solid #D9D2C7; }
.label { font-family: "JetBrains Mono", monospace; font-size: 10px; color: #6A625A; letter-spacing: 0.04em; text-transform: uppercase; }
.sample { font-weight: 500; font-size: 38px; letter-spacing: -0.02em; line-height: 1; }
.sample em { color: #B22230; font-style: italic; font-weight: 500; }
</style>
</head>
<body>
<div class="eyebrow">FRAUNCES — DEFAULT + SOFT + SUPERSOFT (72pt)</div>
<div class="row">
  <div class="label">Default</div>
  <div class="sample" style="font-family: 'Fraunces', serif;">Ships the <em>thing.</em></div>
</div>
<div class="row">
  <div class="label">72pt</div>
  <div class="sample" style="font-family: 'Fraunces 72pt', serif;">Ships the <em>thing.</em></div>
</div>
<div class="row">
  <div class="label">72pt Soft</div>
  <div class="sample" style="font-family: 'Fraunces 72pt Soft', serif;">Ships the <em>thing.</em></div>
</div>
<div class="row">
  <div class="label">72pt SuperSoft</div>
  <div class="sample" style="font-family: 'Fraunces 72pt SuperSoft', serif;">Ships the <em>thing.</em></div>
</div>
</body>
</html>
