<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Engagement row</title>
<style>
@import url("../colors_and_type.css");
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: #FBF8F4;
  color: #14110F;
  font-family: "Inter", -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body { padding: 24px 28px; min-height: 100vh; }
:root {
  --crimson:#B22230; --crimson-deep:#8E1A26; --crimson-soft:#FF8B96;
  --paper:#FBF8F4; --paper-2:#F1ECE3; --paper-3:#ECE7DC;
  --ink:#14110F; --ink-2:#2A2520; --mute:#6A625A; --rule:#D9D2C7;
  --green:#2F6E4E;
  --serif: "Fraunces", Georgia, serif;
  --sans: "Inter", -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.row { display:flex; gap:16px; align-items:stretch; flex-wrap:wrap; }
.col { display:flex; flex-direction:column; gap:12px; }
.swatch { width: 100%; height: 64px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.04); }
.sw-meta { display:flex; justify-content:space-between; gap:8px; font-family: var(--mono); font-size: 11px; color: var(--mute); margin-top: 8px; }
.sw-meta .name { color: var(--ink-2); font-weight:500; }
.sw-meta .hex { color: var(--mute); }
.tile { display:flex; flex-direction:column; }
</style>
</head>
<body>

<div style="display:grid; grid-template-columns:60px 1.2fr 1.6fr auto; gap:24px; align-items:baseline; padding:18px 0; border-top:1px solid #D9D2C7; border-bottom:1px solid #D9D2C7;">
  <div style="font-family:var(--mono); font-size:12px; color:#6A625A;">2024</div>
  <div>
    <div style="font-family:var(--serif); font-weight:500; font-size:22px; letter-spacing:-0.01em;">Quadax</div>
    <div style="font-family:var(--mono); font-size:10px; color:#6A625A; letter-spacing:0.06em; text-transform:uppercase; margin-top:4px;">Eligibility Management Suite</div>
  </div>
  <div style="font-family:var(--sans); font-size:13px; color:#2A2520; line-height:1.5;">Designed and built the internal eligibility verification suite used by billing and ops teams — multi-step workflows, insurance API integration, audit logging.</div>
  <div style="font-family:var(--mono); font-size:11px; color:#6A625A; text-align:right;">React · TS</div>
</div>

</body>
</html>
