<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iconography stance</title>
<style>
@import url("../colors_and_type.css");
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: #FBF8F4;
  color: #14110F;
  font-family: "Inter", -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body { padding: 24px 28px; min-height: 100vh; }
:root {
  --crimson:#B22230; --crimson-deep:#8E1A26; --crimson-soft:#FF8B96;
  --paper:#FBF8F4; --paper-2:#F1ECE3; --paper-3:#ECE7DC;
  --ink:#14110F; --ink-2:#2A2520; --mute:#6A625A; --rule:#D9D2C7;
  --green:#2F6E4E;
  --serif: "Fraunces", Georgia, serif;
  --sans: "Inter", -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.row { display:flex; gap:16px; align-items:stretch; flex-wrap:wrap; }
.col { display:flex; flex-direction:column; gap:12px; }
.swatch { width: 100%; height: 64px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.04); }
.sw-meta { display:flex; justify-content:space-between; gap:8px; font-family: var(--mono); font-size: 11px; color: var(--mute); margin-top: 8px; }
.sw-meta .name { color: var(--ink-2); font-weight:500; }
.sw-meta .hex { color: var(--mute); }
.tile { display:flex; flex-direction:column; }
</style>
</head>
<body>

<div class="eyebrow" style="margin-bottom:14px;">NO ICONS — TYPOGRAPHY DOES THE WORK</div>
<div style="display:flex; gap:28px; align-items:center; flex-wrap:wrap;">
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
    <div style="font-family:var(--mono); font-size:18px; color:#B22230;">01 —</div>
    <div style="font-family:var(--mono); font-size:10px; color:#6A625A;">mono numerals</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
    <div style="font-size:22px; color:#2A2520;">→</div>
    <div style="font-family:var(--mono); font-size:10px; color:#6A625A;">unicode arrow</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
    <div style="font-size:22px; color:#2A2520;">·</div>
    <div style="font-family:var(--mono); font-size:10px; color:#6A625A;">middot separator</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
    <div style="font-size:22px; color:#2A2520;">—</div>
    <div style="font-family:var(--mono); font-size:10px; color:#6A625A;">em-dash</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
    <div style="width:6px; height:6px; background:#2F6E4E; border-radius:50%;"></div>
    <div style="font-family:var(--mono); font-size:10px; color:#6A625A;">availability dot</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px; opacity:0.4;">
    <div style="font-size:22px; color:#B22230;">✗</div>
    <div style="font-family:var(--mono); font-size:10px; color:#B22230;">no emoji</div>
  </div>
</div>

</body>
</html>
